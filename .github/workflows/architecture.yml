name: Architecture

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/architecture.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/architecture.yml'

permissions:
  contents: read

concurrency:
  group: architecture-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build LikeC4 site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build architecture site
        uses: likec4/actions@v1
        with:
          action: build
          path: docs/architecture
          output: likec4-dist
          base: ${{ steps.pages.outputs.base_path }}

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' || github.head_ref == 'issue-342-likec4-architecture-spike'
        uses: actions/upload-pages-artifact@v4
        with:
          path: likec4-dist

  deploy:
    name: Deploy LikeC4 site
    if: github.event_name == 'push' || github.head_ref == 'issue-342-likec4-architecture-spike'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'github-pages-preview' || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
