name: Architecture

on:
  pull_request:
    paths:
      - 'docs/architecture/**'
      - '.github/workflows/architecture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build LikeC4 site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build architecture site
        uses: likec4/actions@v1
        with:
          action: build
          path: docs/architecture
          output: likec4-dist

      - name: Upload architecture artifact
        uses: actions/upload-artifact@v4
        with:
          name: accounterbro-architecture-${{ github.event.pull_request.head.sha || github.sha }}
          path: likec4-dist
          if-no-files-found: error
          retention-days: 7
