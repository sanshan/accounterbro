name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: accounterbro
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d accounterbro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      API_DB_HOST: 127.0.0.1
      API_DB_PORT: 5432
      API_DB_USERNAME: postgres
      API_DB_PASSWORD: postgres
      API_DB_NAME: accounterbro_api_e2e
      API_PORT: 3100
      DOCUMENTS_DB_HOST: 127.0.0.1
      DOCUMENTS_DB_PORT: 5432
      DOCUMENTS_DB_USERNAME: postgres
      DOCUMENTS_DB_PASSWORD: postgres
      DOCUMENTS_DB_NAME: accounterbro_documents_e2e
      DOCUMENTS_PORT: 3101
      DOCUMENTS_STORAGE_DRIVER: local-folder
      DOCUMENTS_STORAGE_LOCAL_FOLDER_ROOT: /tmp/accounterbro-documents-e2e
      WEB_PORT: 4300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set Nx affected SHAs
        uses: nrwl/nx-set-shas@v5

      - name: Verify Nx project references
        run: pnpm nx sync:check

      - name: Validate review catalog
        run: pnpm review:validate

      - name: Create E2E databases
        env:
          PGPASSWORD: ${{ env.API_DB_PASSWORD }}
        run: |
          psql \
            --host="$API_DB_HOST" \
            --port="$API_DB_PORT" \
            --username="$API_DB_USERNAME" \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --command="CREATE DATABASE $API_DB_NAME;"
          psql \
            --host="$DOCUMENTS_DB_HOST" \
            --port="$DOCUMENTS_DB_PORT" \
            --username="$DOCUMENTS_DB_USERNAME" \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --command="CREATE DATABASE $DOCUMENTS_DB_NAME;"

      - name: Run lint
        run: pnpm nx run-many -t lint

      - name: Run type checks
        run: pnpm nx run-many -t typecheck

      - name: Run database migrations
        run: |
          pnpm nx run @accounterbro/api:migration:run
          pnpm nx run @accounterbro/documents-service:migration:run

      - name: Run unit and integration tests
        run: pnpm nx affected -t test

      - name: Build applications
        run: pnpm nx run-many -t build

      - name: Run E2E
        run: pnpm nx affected -t e2e --parallel=1

      - name: Verify API artifact startup
        shell: bash
        run: |
          pnpm nx run @accounterbro/api:start > /tmp/api.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null "http://127.0.0.1:${API_PORT}/api/health/live"; then
              cleanup
              trap - EXIT
              exit 0
            fi
            sleep 1
          done
          cat /tmp/api.log
          exit 1

      - name: Verify Web artifact startup
        shell: bash
        run: |
          pnpm nx run @accounterbro/web:serve-static --port="${WEB_PORT}" --watch=false > /tmp/web.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null "http://localhost:${WEB_PORT}"; then
              cleanup
              trap - EXIT
              exit 0
            fi
            sleep 1
          done
          cat /tmp/web.log
          exit 1
