name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: application_template
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d application_template"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: application_template
      API_PORT: 3100
      WEB_PORT: 4300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm nx run-many -t lint

      - name: Run type checks
        run: pnpm nx run-many -t typecheck

      - name: Run database migrations
        run: pnpm nx run @application-template/api:migration:run

      - name: Run unit and integration tests
        run: pnpm nx run-many -t test

      - name: Build applications
        run: pnpm nx run-many -t build

      - name: Run API E2E
        run: pnpm nx run @application-template/api-e2e:e2e

      - name: Verify API artifact startup
        shell: bash
        run: |
          pnpm nx run @application-template/api:start > /tmp/api.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null "http://127.0.0.1:${API_PORT}/api/health/live"; then
              cleanup
              trap - EXIT
              exit 0
            fi
            sleep 1
          done
          cat /tmp/api.log
          exit 1

      - name: Verify Web artifact startup
        shell: bash
        run: |
          pnpm nx run @application-template/web:serve-static --port="${WEB_PORT}" --watch=false > /tmp/web.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null "http://localhost:${WEB_PORT}"; then
              cleanup
              trap - EXIT
              exit 0
            fi
            sleep 1
          done
          cat /tmp/web.log
          exit 1

  web-e2e:
    name: Web E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --user 1001

    env:
      NODE_ENV: test
      API_PORT: 3100
      WEB_PORT: 4300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Web E2E
        run: pnpm nx run @application-template/web-e2e:e2e
