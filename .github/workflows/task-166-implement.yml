name: Task 166 Documents runtime composition

on:
  push:
    branches:
      - issue-166-documents-runtime-composition

permissions:
  contents: write

jobs:
  implement:
    name: Implement and verify Documents runtime composition
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: accounterbro
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d accounterbro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v6
        with:
          ref: issue-166-documents-runtime-composition
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migration
        run: python3 .github/task-166.py
      - name: Verify Documents service
        env:
          DOCUMENTS_DATABASE_HOST: 127.0.0.1
          DOCUMENTS_DATABASE_PORT: 5432
          DOCUMENTS_DATABASE_USERNAME: postgres
          DOCUMENTS_DATABASE_PASSWORD: postgres
          DOCUMENTS_DATABASE_NAME: accounterbro
        run: |
          pnpm nx run @accounterbro/documents-service:lint
          pnpm nx run @accounterbro/documents-service:typecheck
          pnpm nx run @accounterbro/documents-service:test
          pnpm nx run @accounterbro/documents-service:build
          pnpm nx run @accounterbro/documents-service:migration:show
      - name: Commit verified implementation
        run: |
          rm .github/task-166.py .github/workflows/task-166-implement.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(documents): use manifest runtime composition'
          git push origin HEAD:issue-166-documents-runtime-composition
