name: Task 162 runtime executions rename

on:
  push:
    branches:
      - issue-162-runtime-executions-rename

permissions:
  contents: write

jobs:
  rename:
    name: Apply mechanical rename
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v6
        with:
          ref: issue-162-runtime-executions-rename

      - name: Rename package and references
        shell: bash
        run: |
          set -euo pipefail

          git mv packages/service-runtime packages/runtime-executions

          while IFS= read -r -d '' file; do
            sed -i 's/service-runtime/runtime-executions/g' "$file"
          done < <(git grep -Ilz 'service-runtime' -- ':!*.png' ':!*.jpg' ':!*.jpeg' ':!*.webp' || true)

          sed -i 's/^# Service Runtime Agent Rules$/# Runtime Executions Agent Rules/' packages/runtime-executions/AGENTS.md

          rm .github/workflows/task-162-rename.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: rename service runtime to runtime executions'
          git push origin HEAD:issue-162-runtime-executions-rename
