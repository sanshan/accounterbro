name: Task 163 runtime DI contracts

on:
  push:
    branches:
      - issue-163-runtime-valued-execution-contracts

permissions:
  contents: write

jobs:
  implement:
    name: Implement and verify runtime contracts
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: accounterbro
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d accounterbro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout task branch
        uses: actions/checkout@v6
        with:
          ref: issue-163-runtime-valued-execution-contracts

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Implement runtime-valued contracts
        run: python3 .github/task-163.py

      - name: Verify runtime-executions
        shell: bash
        run: |
          set -euo pipefail
          pnpm nx run @accounterbro/runtime-executions:lint
          pnpm nx run @accounterbro/runtime-executions:typecheck
          pnpm nx run @accounterbro/runtime-executions:test
          pnpm nx run @accounterbro/runtime-executions:build

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/task-163-implement.yml .github/task-163.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(runtime-executions): add runtime-valued DI contracts'
          git push origin HEAD:issue-163-runtime-valued-execution-contracts
