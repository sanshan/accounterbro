name: Task 167 Runtime guidance follow-up

on:
  push:
    branches:
      - issue-167-runtime-composition-guidance

permissions:
  contents: write

jobs:
  update:
    name: Align and verify package runtime guidance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v6
        with:
          ref: issue-167-runtime-composition-guidance
      - name: Apply package guidance alignment
        run: python3 .github/task-167-followup.py
      - name: Verify guidance
        run: |
          test -z "$(git grep -n 'Service-facing .* /execution' -- docs/engineering/package-guidelines.md || true)"
          git grep -n 'Standard hosting consumes this data through the package `/runtime` manifest' docs/engineering/package-guidelines.md
          git grep -n 'RuntimeExecutionsModule.register' apps/services/AGENTS.md docs/engineering/service-guidelines.md packages/runtime-executions/AGENTS.md
          git diff --check
      - name: Commit verified alignment
        run: |
          rm .github/task-167-followup.py .github/workflows/task-167-followup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: align package execution guidance with runtime manifests'
          git push origin HEAD:issue-167-runtime-composition-guidance
