x-documents-image: &documents-image
    image: accounterbro/documents-load:local
    build:
        context: ../../..
        dockerfile: apps/services/documents-load/Dockerfile

x-documents-environment: &documents-environment
    DOCUMENTS_DB_HOST: database
    DOCUMENTS_DB_PORT: 5432
    DOCUMENTS_DB_USERNAME: postgres
    DOCUMENTS_DB_PASSWORD: postgres
    DOCUMENTS_DB_NAME: accounterbro_documents_load
    DOCUMENTS_PORT: 3001
    DOCUMENTS_STORAGE_DRIVER: local-folder
    DOCUMENTS_STORAGE_LOCAL_FOLDER_ROOT: /data/documents
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318

services:
    database:
        image: postgres:17.6-alpine
        environment:
            POSTGRES_DB: accounterbro_documents_load
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
            interval: 2s
            timeout: 5s
            retries: 30
            start_period: 5s
        volumes:
            - database-data:/var/lib/postgresql/data

    lgtm:
        image: grafana/otel-lgtm:0.32.0
        environment:
            GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/custom/k6-prometheus.json
        ports:
            - '${DOCUMENTS_LOAD_GRAFANA_PORT:-3300}:3000'
            - '${DOCUMENTS_LOAD_PROMETHEUS_PORT:-9091}:9090'
            - '${DOCUMENTS_LOAD_TEMPO_PORT:-3201}:3200'
        volumes:
            - lgtm-data:/data
            - ./grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/custom:ro
            - ./grafana/dashboards-provisioning.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro

    documents-migrations:
        <<: *documents-image
        command: ['pnpm', 'nx', 'run', '@accounterbro/documents-service:migration:run']
        environment: *documents-environment
        depends_on:
            database:
                condition: service_healthy

    documents:
        <<: *documents-image
        environment: *documents-environment
        depends_on:
            documents-migrations:
                condition: service_completed_successfully
            lgtm:
                condition: service_healthy
        ports:
            - '${DOCUMENTS_LOAD_HTTP_PORT:-3101}:3001'
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:3001/health/ready').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
                ]
            interval: 2s
            timeout: 5s
            retries: 30
            start_period: 5s
        volumes:
            - documents-data:/data/documents

    k6:
        image: grafana/k6:2.2.0
        profiles: ['load']
        working_dir: /load
        command: ['version']
        environment:
            K6_PROMETHEUS_RW_SERVER_URL: http://lgtm:9090/api/v1/write
            K6_PROMETHEUS_RW_TREND_STATS: p(90),p(95),p(99),min,max,avg
            K6_PROMETHEUS_RW_STALE_MARKERS: 'true'
        depends_on:
            documents:
                condition: service_healthy
            lgtm:
                condition: service_healthy
        volumes:
            - ./:/load:ro
            - ./reports:/reports

volumes:
    database-data:
    documents-data:
    lgtm-data:
