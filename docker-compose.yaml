services:
  database:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${API_DB_NAME:-accounterbro}
      POSTGRES_USER: ${API_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${API_DB_PASSWORD:-postgres}
    ports:
      - '${API_DB_PORT:-5432}:5432'
    volumes:
      - accounterbro-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  accounterbro-postgres-data:
